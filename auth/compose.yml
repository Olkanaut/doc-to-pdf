name: lasuite-auth

services:
  lasuite-keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB:?KEYCLOAK_POSTGRES_DB is required}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER:?KEYCLOAK_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?KEYCLOAK_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 2s
      retries: 120
    volumes:
      - lasuite-keycloak-db:/var/lib/postgresql/data

  lasuite-keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command:
      - start-dev
      - --features=preview
      - --import-realm
      - --hostname=http://localhost:${LASUITE_AUTH_PORT:?LASUITE_AUTH_PORT is required}
      - --hostname-strict=false
      - --health-enabled=true
      - --metrics-enabled=true
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL_HOST: lasuite-keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_POSTGRES_DB:?KEYCLOAK_POSTGRES_DB is required}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?KEYCLOAK_POSTGRES_PASSWORD is required}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER:?KEYCLOAK_POSTGRES_USER is required}
      KC_DB_SCHEMA: public
    ports:
      - "${LASUITE_AUTH_PORT:?LASUITE_AUTH_PORT is required}:8080"
    volumes:
      - ./.generated/realm-lasuite.json:/opt/keycloak/data/import/realm-lasuite.json:ro
    networks:
      default: {}
      lasuite:
        aliases:
          - lasuite-keycloak
          - keycloak
    depends_on:
      lasuite-keycloak-db:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'exec 3<>/dev/tcp/localhost/9000; echo -e "GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep "HTTP/1.1 200 OK" <&3',
        ]
      start_period: 10s
      interval: 2s
      timeout: 2s
      retries: 120

volumes:
  lasuite-keycloak-db:

networks:
  lasuite:
    name: lasuite-network
    external: true
